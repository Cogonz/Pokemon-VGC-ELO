name: Ingest

# Pulls new Limitless tournaments into the production Postgres (Neon) and
# recomputes the stored Elo ratings. Too long-running for a Vercel request, so
# it runs here. Requires repo secrets: DATABASE_URL (use Neon's direct/unpooled
# connection string) and optionally LIMITLESS_API_KEY.
on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      until:
        description: 'Optional backfill: extend history back to this date (YYYY-MM-DD), e.g. 2025-12-31'
        required: false
        default: ''

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run ingest -- ${{ inputs.until != '' && format('--until={0}', inputs.until) || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}

      # Fills pokemon_species (types) and move_reference from PokeAPI for any species the ingest
      # just saw. The site's type badges and team-weakness suggestions read these tables.
      - run: npm run pokedex
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
